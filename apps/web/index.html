<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F4FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>social switchboard</title>
    <script>
      // Apply a saved light/dark choice before first paint, so the page never flashes the wrong theme.
      try {
        const saved = localStorage.getItem('ss-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
