<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Chat</title>
    <!-- The chat window /webchat.js opens on a website. Plain HTML and JS, so it loads fast. -->
    <style>
      :root {
        --accent: #5b2ef0;
        --bg: #ffffff;
        --ink: #16161a;
        --muted: #6b6b76;
        --line: #e4e4ea;
        --bubble: #f2f2f6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171b;
          --ink: #f2f2f5;
          --muted: #a0a0ab;
          --line: #2c2c33;
          --bubble: #24242b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px 14px 16px;
        padding-top: max(14px, env(safe-area-inset-top));
        background: var(--accent);
        color: #fff;
      }
      header h1 {
        flex: 1;
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px 14px;
      }
      .msg {
        max-width: 85%;
        display: grid;
        gap: 6px;
      }
      .msg.us {
        align-self: flex-start;
      }
      .msg.visitor {
        align-self: flex-end;
      }
      .bubble {
        padding: 9px 12px;
        border-radius: 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .us .bubble {
        background: var(--bubble);
        border-bottom-left-radius: 4px;
      }
      .visitor .bubble {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .bubble a {
        color: inherit;
      }
      .msg img {
        max-width: 100%;
        max-height: 260px;
        border-radius: 12px;
      }
      .choice {
        display: block;
        width: 100%;
        padding: 9px 12px;
        border: 1.5px solid var(--accent);
        border-radius: 12px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        .choice {
          color: var(--ink);
        }
      }
      .choice:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #quick {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        padding: 0 14px 8px;
      }
      #quick:empty {
        display: none;
      }
      #quick .choice {
        width: auto;
        border-radius: 999px;
        padding: 6px 14px;
      }
      .typing {
        color: var(--muted);
        font-size: 13px;
        padding-left: 4px;
      }
      #error {
        margin: 0;
        padding: 0 16px 6px;
        color: #c62828;
        font-size: 13px;
      }
      #error:empty {
        display: none;
      }
      form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }
      textarea {
        flex: 1;
        min-height: 42px;
        max-height: 120px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        resize: none;
        overflow-y: hidden;
      }
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-color: var(--accent);
        border-color: transparent;
      }
      #send {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #send:disabled {
        opacity: 0.5;
      }
      footer {
        padding: 0 12px 8px;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Chat</h1>
      <button class="icon-button" id="close" type="button" aria-label="Close the chat">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path
            d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"
          />
        </svg>
      </button>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <div id="quick"></div>
    <p id="error" role="alert"></p>
    <form id="composer">
      <textarea id="text" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path
            d="M227.32,28.68a16,16,0,0,0-15.66-4.08l-.15,0L19.57,82.84a16,16,0,0,0-2.49,29.8L102,154l41.3,84.87A15.86,15.86,0,0,0,157.74,248q.69,0,1.38-.06a15.88,15.88,0,0,0,14-11.51l58.2-191.94c0-.05,0-.1,0-.15A16,16,0,0,0,227.32,28.68ZM157.83,231.85l-.05.14,0-.07-40.06-82.3,48-48a8,8,0,0,0-11.31-11.31l-48,48L24.08,98.25l-.07,0,.14,0L216,40Z"
          />
        </svg>
      </button>
    </form>
    <footer>Chat by Social Switchboard</footer>
    <script src="/webchat-frame.js"></script>
  </body>
</html>
